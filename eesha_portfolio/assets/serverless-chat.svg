<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11122b"/>
      <stop offset="1" stop-color="#1c1d4d"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#5a5aff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#5a5aff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#3a3c7a"/>
    </pattern>
    <style>
      .wire{stroke-dasharray:4 6;animation:f 1s linear infinite}
      @keyframes f{to{stroke-dashoffset:-20}}
      .blink{animation:bl 1.6s ease-in-out infinite}
      @keyframes bl{50%{opacity:.25}}
    </style>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <circle cx="400" cy="250" r="260" fill="url(#glow)"/>

  <!-- AWS cloud boundary -->
  <rect x="250" y="70" width="510" height="360" rx="22" fill="none" stroke="#5a5aff" stroke-opacity=".5" stroke-dasharray="8 8"/>
  <rect x="270" y="58" width="96" height="24" rx="12" fill="#1c1d4d" stroke="#5a5aff" stroke-opacity=".6"/>
  <text x="318" y="74" text-anchor="middle" fill="#b7b9ff" font-size="11" font-weight="700" letter-spacing="1.5">AWS CLOUD</text>

  <!-- wires -->
  <path id="p1" d="M170 250 H330" class="wire" stroke="#8c8eff" stroke-width="2" fill="none"/>
  <path id="p2" d="M420 250 H520" class="wire" stroke="#8c8eff" stroke-width="2" fill="none"/>
  <path id="p3" d="M610 250 C660 250 640 160 680 160" class="wire" stroke="#8c8eff" stroke-width="2" fill="none"/>
  <path id="p4" d="M610 250 C660 250 640 340 680 340" class="wire" stroke="#8c8eff" stroke-width="2" fill="none"/>

  <!-- packets -->
  <g opacity="0">
    <rect x="-14" y="-9" width="28" height="18" rx="5" fill="#fff"/>
    <path d="M-8 -3h16M-8 2h10" stroke="#3b3bf5" stroke-width="2" stroke-linecap="round"/>
    <animateMotion dur="3.6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.3;1" calcMode="linear"><mpath href="#p1"/></animateMotion>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.3;.31;1" dur="3.6s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <circle r="6" fill="#66e6df"/>
    <animateMotion dur="3.6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.32;.55;1" calcMode="linear"><mpath href="#p2"/></animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.31;.32;.55;.56;1" dur="3.6s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <circle r="6" fill="#ff9f5a"/>
    <animateMotion dur="3.6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.57;.82;1" calcMode="linear"><mpath href="#p3"/></animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.56;.57;.82;.83;1" dur="3.6s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <circle r="6" fill="#ff9f5a"/>
    <animateMotion dur="3.6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.57;.82;1" calcMode="linear"><mpath href="#p4"/></animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.56;.57;.82;.83;1" dur="3.6s" repeatCount="indefinite"/>
  </g>

  <!-- client phone -->
  <g transform="translate(110 250)">
    <rect x="-54" y="-110" width="108" height="220" rx="20" fill="#f5f5ff"/>
    <rect x="-18" y="-100" width="36" height="6" rx="3" fill="#d6d7f2"/>
    <rect x="-42" y="-78" width="64" height="22" rx="8" fill="#e3e4ff"/>
    <rect x="-20" y="-48" width="62" height="22" rx="8" fill="#3b3bf5"/>
    <rect x="-42" y="-18" width="74" height="22" rx="8" fill="#e3e4ff"/>
    <rect x="-6" y="12" width="48" height="22" rx="8" fill="#3b3bf5"/>
    <rect x="-42" y="76" width="84" height="20" rx="10" fill="#fff" stroke="#d6d7f2"/>
    <text y="140" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Client</text>
  </g>

  <!-- API Gateway -->
  <g transform="translate(375 250)">
    <rect x="-45" y="-45" width="90" height="90" rx="20" fill="#2a2b6a" stroke="#8c8eff"/>
    <path d="M-18 -16 0 -26 18 -16v32L0 26-18 16z" fill="none" stroke="#c4a6ff" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-8 -4h16M-8 4h16" stroke="#c4a6ff" stroke-width="3" stroke-linecap="round"/>
    <text y="72" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">API Gateway</text>
    <text y="90" text-anchor="middle" fill="#8c8eff" font-size="11" font-family="monospace">POST /messages</text>
  </g>

  <!-- Lambda -->
  <g transform="translate(565 250)">
    <rect x="-45" y="-45" width="90" height="90" rx="20" fill="#2a2b6a" stroke="#8c8eff"/>
    <path d="M-16 20 0 -20h8l18 40h-9L5 -4-6 20z" fill="#ff9f5a"/>
    <text y="72" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Lambda</text>
  </g>

  <!-- DynamoDB -->
  <g transform="translate(710 160)">
    <rect x="-34" y="-34" width="68" height="68" rx="16" fill="#2a2b6a" stroke="#8c8eff"/>
    <ellipse cy="-10" rx="15" ry="5.5" fill="#7d7dff"/>
    <path d="M-15 -10v20c0 3 6.7 5.5 15 5.5s15-2.5 15-5.5v-20c0 3-6.7 5.5-15 5.5s-15-2.5-15-5.5z" fill="#5a5aff"/>
    <text y="56" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">DynamoDB</text>
  </g>
  <!-- response -->
  <g transform="translate(710 340)">
    <rect x="-34" y="-34" width="68" height="68" rx="16" fill="#2a2b6a" stroke="#8c8eff"/>
    <text y="6" text-anchor="middle" fill="#66e6df" font-size="15" font-weight="700" font-family="monospace">200</text>
    <circle class="blink" cx="20" cy="-20" r="4" fill="#66e6df"/>
    <text y="56" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">REST API</text>
  </g>
</svg>
