<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0ff"/>
      <stop offset="1" stop-color="#dcdcff"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a5aff"/>
      <stop offset="1" stop-color="#3b3bf5"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#2a2a8a" flood-opacity=".18"/>
    </filter>
    <style>
      .dot{animation:b 1.2s ease-in-out infinite}
      .d2{animation-delay:.15s}.d3{animation-delay:.3s}
      @keyframes b{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
      .flow{stroke-dasharray:6 8;animation:f 1.2s linear infinite}
      @keyframes f{to{stroke-dashoffset:-28}}
      .pulse{transform-box:fill-box;transform-origin:center;animation:p 2.4s ease-in-out infinite}
      @keyframes p{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.25);opacity:0}}
      .msg{opacity:0;animation:m 6s ease infinite}
      .m2{animation-delay:.8s}.m3{animation-delay:1.6s}
      @keyframes m{0%{opacity:0;transform:translateY(8px)}8%,85%{opacity:1;transform:none}100%{opacity:0}}
    </style>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g opacity=".5" stroke="#b9bbf5" stroke-width="1">
    <path d="M0 125H800M0 250H800M0 375H800M200 0V500M400 0V500M600 0V500"/>
  </g>

  <!-- chat window -->
  <g filter="url(#sh)">
    <rect x="60" y="60" width="380" height="380" rx="22" fill="#fff"/>
  </g>
  <rect x="60" y="60" width="380" height="64" rx="22" fill="url(#acc)"/>
  <rect x="60" y="100" width="380" height="24" fill="url(#acc)"/>
  <circle cx="100" cy="92" r="16" fill="#fff" opacity=".95"/>
  <path d="M93 89h14M93 95h9" stroke="#3b3bf5" stroke-width="3" stroke-linecap="round"/>
  <text x="128" y="88" fill="#fff" font-size="15" font-weight="700">College Desk</text>
  <text x="128" y="106" fill="#d9dbff" font-size="11">● Online · Admissions help</text>

  <g class="msg">
    <rect x="84" y="148" width="230" height="52" rx="14" fill="#f0f1ff"/>
    <text x="100" y="170" fill="#22224a" font-size="13">Hi! How can I help with</text>
    <text x="100" y="188" fill="#22224a" font-size="13">your admission today?</text>
  </g>
  <g class="msg m2">
    <rect x="200" y="216" width="216" height="36" rx="14" fill="#3b3bf5"/>
    <text x="216" y="239" fill="#fff" font-size="13">What's the fee for B.Sc CS?</text>
  </g>
  <g class="msg m3">
    <rect x="84" y="268" width="250" height="70" rx="14" fill="#f0f1ff"/>
    <text x="100" y="290" fill="#6a6aa0" font-size="10" font-weight="700" letter-spacing="1">INTENT · FeeEnquiry</text>
    <text x="100" y="308" fill="#22224a" font-size="13">Slot: course = B.Sc CS ✓</text>
    <text x="100" y="326" fill="#22224a" font-size="13">Fetching details…</text>
  </g>
  <g transform="translate(100 368)">
    <rect x="-16" y="-14" width="64" height="28" rx="14" fill="#f0f1ff"/>
    <circle class="dot" cx="0" cy="0" r="4" fill="#3b3bf5"/>
    <circle class="dot d2" cx="16" cy="0" r="4" fill="#3b3bf5"/>
    <circle class="dot d3" cx="32" cy="0" r="4" fill="#3b3bf5"/>
  </g>
  <rect x="80" y="396" width="340" height="28" rx="14" fill="#f6f6fb" stroke="#e3e4f5"/>
  <text x="96" y="414" fill="#a0a2c4" font-size="12">Type a message…</text>

  <!-- architecture nodes -->
  <path class="flow" d="M440 250 C490 250 500 140 560 140" fill="none" stroke="#3b3bf5" stroke-width="2.5"/>
  <path class="flow" d="M640 140 C690 140 690 250 640 250" fill="none" stroke="#3b3bf5" stroke-width="2.5"/>
  <path class="flow" d="M640 250 C690 250 690 360 640 360" fill="none" stroke="#3b3bf5" stroke-width="2.5"/>

  <g transform="translate(600 140)">
    <circle class="pulse" r="40" fill="#3b3bf5"/>
    <circle r="40" fill="#fff" filter="url(#sh)"/>
    <path d="M-14 -8a14 14 0 0 1 28 0v6a8 8 0 0 1-8 8h-6l-8 7v-7a6 6 0 0 1-6-6z" fill="url(#acc)"/>
    <text y="62" text-anchor="middle" fill="#22224a" font-size="13" font-weight="700">Amazon Lex</text>
  </g>
  <g transform="translate(600 250)">
    <circle r="40" fill="#fff" filter="url(#sh)"/>
    <path d="M-12 14 2 -14h6l14 28h-7L5 -4-5 14z" fill="#ff8a3d"/>
    <text y="62" text-anchor="middle" fill="#22224a" font-size="13" font-weight="700">AWS Lambda</text>
  </g>
  <g transform="translate(600 360)">
    <circle r="40" fill="#fff" filter="url(#sh)"/>
    <ellipse cx="0" cy="-10" rx="16" ry="6" fill="#4b6bff"/>
    <path d="M-16 -10v20c0 3.3 7.2 6 16 6s16-2.7 16-6v-20c0 3.3-7.2 6-16 6s-16-2.7-16-6z" fill="#3b3bf5"/>
    <path d="M-16 0c0 3.3 7.2 6 16 6s16-2.7 16-6" stroke="#fff" stroke-width="1.5" fill="none" opacity=".6"/>
    <text y="62" text-anchor="middle" fill="#22224a" font-size="13" font-weight="700">DynamoDB</text>
  </g>
</svg>
