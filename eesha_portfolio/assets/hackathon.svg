<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3bf5"/>
      <stop offset="1" stop-color="#1f1f8f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f0b43c"/>
    </linearGradient>
    <style>
      .stream{stroke-dasharray:2 10;stroke-linecap:round;animation:f .8s linear infinite}
      @keyframes f{to{stroke-dashoffset:-24}}
      .sig{transform-box:fill-box;transform-origin:center;animation:s 2s ease-out infinite}
      .s2{animation-delay:.6s}.s3{animation-delay:1.2s}
      @keyframes s{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.8);opacity:0}}
      .spin{transform-box:fill-box;transform-origin:center;animation:sp 12s linear infinite}
      @keyframes sp{to{transform:rotate(360deg)}}
      .grow{transform-box:fill-box;transform-origin:bottom;animation:g 3s ease-in-out infinite alternate}
      .g2{animation-delay:-1s}.g3{animation-delay:-2s}
      @keyframes g{from{transform:scaleY(.45)}to{transform:scaleY(1)}}
    </style>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="#fff" stroke-opacity=".07"><path d="M0 100H800M0 200H800M0 300H800M0 400H800M100 0V500M200 0V500M300 0V500M400 0V500M500 0V500M600 0V500M700 0V500"/></g>

  <!-- IoT sensors -->
  <g fill="#fff">
    <g transform="translate(90 140)"><circle class="sig" r="18" fill="none" stroke="#9fe8ff" stroke-width="2"/><rect x="-16" y="-16" width="32" height="32" rx="8"/><circle r="5" fill="#3b3bf5"/></g>
    <g transform="translate(90 250)"><circle class="sig s2" r="18" fill="none" stroke="#9fe8ff" stroke-width="2"/><rect x="-16" y="-16" width="32" height="32" rx="8"/><circle r="5" fill="#3b3bf5"/></g>
    <g transform="translate(90 360)"><circle class="sig s3" r="18" fill="none" stroke="#9fe8ff" stroke-width="2"/><rect x="-16" y="-16" width="32" height="32" rx="8"/><circle r="5" fill="#3b3bf5"/></g>
  </g>
  <text x="90" y="420" text-anchor="middle" fill="#cfd0ff" font-size="12" font-weight="700">IoT Core</text>

  <g fill="none" stroke="#9fe8ff" stroke-width="4" class="stream">
    <path d="M110 140 C180 140 180 250 250 250"/>
    <path d="M110 250 H250"/>
    <path d="M110 360 C180 360 180 250 250 250"/>
  </g>

  <!-- Kinesis -->
  <g transform="translate(290 250)">
    <rect x="-40" y="-40" width="80" height="80" rx="20" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".4"/>
    <path d="M-20 -12h40M-20 0h40M-20 12h40" stroke="#9fe8ff" stroke-width="4" stroke-linecap="round" class="stream"/>
    <text y="64" text-anchor="middle" fill="#cfd0ff" font-size="12" font-weight="700">Kinesis</text>
  </g>
  <path d="M330 250 H400" stroke="#9fe8ff" stroke-width="4" class="stream"/>

  <!-- SageMaker -->
  <g transform="translate(445 250)">
    <circle r="46" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".4"/>
    <g class="spin">
      <circle r="30" fill="none" stroke="#c4a6ff" stroke-width="2" stroke-dasharray="6 6"/>
    </g>
    <g stroke="#fff" stroke-width="2"><path d="M-14 -10 0 -18 14 -10M-14 10 0 18 14 10M-14 -10v20M14 -10v20M0 -18v36"/></g>
    <g fill="#ffe08a"><circle cx="-14" cy="-10" r="4"/><circle cx="14" cy="-10" r="4"/><circle cx="-14" cy="10" r="4"/><circle cx="14" cy="10" r="4"/><circle cy="-18" r="4"/><circle cy="18" r="4"/></g>
    <text y="70" text-anchor="middle" fill="#cfd0ff" font-size="12" font-weight="700">SageMaker</text>
  </g>
  <path d="M491 250 H540" stroke="#9fe8ff" stroke-width="4" class="stream"/>

  <!-- dashboard -->
  <rect x="540" y="150" width="210" height="200" rx="18" fill="#fff"/>
  <text x="560" y="180" fill="#1f1f8f" font-size="11" font-weight="800" letter-spacing="1.5">DRUG INVENTORY</text>
  <g fill="#e6e7ff"><rect x="566" y="210" width="26" height="110" rx="6"/><rect x="606" y="210" width="26" height="110" rx="6"/><rect x="646" y="210" width="26" height="110" rx="6"/><rect x="686" y="210" width="26" height="110" rx="6"/></g>
  <rect class="grow" x="566" y="240" width="26" height="80" rx="6" fill="#3b3bf5"/>
  <rect class="grow g2" x="606" y="220" width="26" height="100" rx="6" fill="#5a5aff"/>
  <rect class="grow g3" x="646" y="260" width="26" height="60" rx="6" fill="#ff9f5a"/>
  <rect class="grow" x="686" y="230" width="26" height="90" rx="6" fill="#3b3bf5"/>
  <text x="560" y="338" fill="#6b6ca8" font-size="10">Restock forecast · live</text>

  <!-- trophy badge -->
  <g transform="translate(680 90)">
    <circle r="40" fill="url(#gold)"/>
    <path d="M-14 -16h28v10a14 14 0 0 1-28 0z" fill="#fff"/>
    <path d="M-14 -12h-7a7 7 0 0 0 7 10M14 -12h7a7 7 0 0 1-7 10" stroke="#fff" stroke-width="3" fill="none"/>
    <rect x="-3" y="6" width="6" height="8" fill="#fff"/><rect x="-10" y="14" width="20" height="5" rx="2" fill="#fff"/>
  </g>
  <text x="680" y="150" text-anchor="middle" fill="#ffe08a" font-size="11" font-weight="800" letter-spacing="2" opacity="0">RUNNER-UP</text>
</svg>
