<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf1ec"/>
      <stop offset="1" stop-color="#f6dcd3"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3c6b6"/>
      <stop offset="1" stop-color="#e3a08b"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#efe6e1"/>
    </linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8b6e8"/>
      <stop offset="1" stop-color="#9f86d4"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#8a4a3a" flood-opacity=".16"/>
    </filter>
    <clipPath id="face"><circle cx="560" cy="210" r="96"/></clipPath>
    <style>
      .ring{transform-box:fill-box;transform-origin:center;animation:r 2.6s ease-out infinite}
      .r2{animation-delay:1.3s}
      @keyframes r{0%{transform:scale(.8);opacity:.8}100%{transform:scale(1.35);opacity:0}}
      .scan{animation:s 3s ease-in-out infinite alternate}
      @keyframes s{from{transform:translateY(-90px)}to{transform:translateY(90px)}}
      .float{animation:fl 5s ease-in-out infinite}
      .f2{animation-delay:-1.6s}.f3{animation-delay:-3.2s}
      @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      .bar{transform-box:fill-box;transform-origin:left;animation:g 3s ease infinite}
      @keyframes g{0%{transform:scaleX(0)}40%,100%{transform:scaleX(1)}}
    </style>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="140" cy="420" r="160" fill="#fbe4dc"/>
  <circle cx="720" cy="60" r="120" fill="#fbe8e2"/>

  <!-- browser frame -->
  <g filter="url(#sh)"><rect x="40" y="40" width="720" height="420" rx="20" fill="#fffaf7"/></g>
  <circle cx="68" cy="66" r="5" fill="#f0b4a4"/><circle cx="86" cy="66" r="5" fill="#f3d0a8"/><circle cx="104" cy="66" r="5" fill="#cfe3c4"/>
  <text x="72" y="118" fill="#4a2a22" font-size="30" font-family="Georgia, serif" font-style="italic">Sera</text>
  <text x="140" y="118" fill="#a07a6e" font-size="11" letter-spacing="2">SKINCARE</text>
  <g fill="#7a5a50" font-size="12"><text x="420" y="114">Shop</text><text x="470" y="114">Analyse</text><text x="540" y="114">About</text></g>
  <g transform="translate(700 108)">
    <path d="M-12 -8h4l3 14h14l3-10h-18" fill="none" stroke="#4a2a22" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="-3" cy="10" r="2" fill="#4a2a22"/><circle cx="8" cy="10" r="2" fill="#4a2a22"/>
    <circle cx="12" cy="-12" r="8" fill="#e3806a"/>
    <text x="12" y="-8.5" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">2</text>
  </g>
  <line x1="40" y1="140" x2="760" y2="140" stroke="#f1e1da"/>

  <!-- products -->
  <g class="float">
    <rect x="96" y="250" width="56" height="130" rx="14" fill="url(#b1)"/>
    <rect x="110" y="222" width="28" height="32" rx="6" fill="#4a2a22"/>
    <rect x="104" y="300" width="40" height="34" rx="4" fill="#fff" opacity=".85"/>
    <text x="124" y="321" text-anchor="middle" fill="#a0604e" font-size="9" font-weight="700">SERUM</text>
  </g>
  <g class="float f2">
    <rect x="176" y="290" width="76" height="90" rx="12" fill="url(#b2)" stroke="#eadad3"/>
    <rect x="182" y="270" width="64" height="24" rx="8" fill="#e3a08b"/>
    <text x="214" y="342" text-anchor="middle" fill="#a0604e" font-size="9" font-weight="700">CREAM</text>
  </g>
  <g class="float f3">
    <rect x="276" y="230" width="48" height="150" rx="20" fill="url(#b3)"/>
    <path d="M290 230v-26h20v26" fill="#4a2a22"/>
    <rect x="296" y="196" width="8" height="10" fill="#4a2a22"/>
    <text x="300" y="316" text-anchor="middle" fill="#fff" font-size="9" font-weight="700" transform="rotate(-90 300 316)">TONER</text>
  </g>
  <rect x="80" y="380" width="260" height="10" rx="5" fill="#f3e4dd"/>
  <text x="80" y="176" fill="#4a2a22" font-size="22" font-family="Georgia, serif">Skincare that</text>
  <text x="80" y="202" fill="#4a2a22" font-size="22" font-family="Georgia, serif" font-style="italic">understands you.</text>

  <!-- AI analysis -->
  <circle class="ring" cx="560" cy="210" r="96" fill="none" stroke="#e3806a" stroke-width="2"/>
  <circle class="ring r2" cx="560" cy="210" r="96" fill="none" stroke="#e3806a" stroke-width="2"/>
  <circle cx="560" cy="210" r="96" fill="#f8e0d6"/>
  <g clip-path="url(#face)">
    <ellipse cx="560" cy="200" rx="46" ry="58" fill="#f1c3ad"/>
    <path d="M500 330c10-40 40-60 60-60s50 20 60 60z" fill="#f1c3ad"/>
    <path d="M512 196c-4-50 30-72 50-72s52 18 46 70c-8-26-22-34-46-36-22 2-40 12-50 38z" fill="#5a3226"/>
    <g fill="#e3806a" opacity=".55"><circle cx="540" cy="214" r="3"/><circle cx="582" cy="206" r="2.5"/><circle cx="574" cy="226" r="2"/></g>
    <g class="scan"><rect x="460" y="208" width="200" height="3" fill="#e3806a"/><rect x="460" y="190" width="200" height="20" fill="#e3806a" opacity=".12"/></g>
  </g>
  <circle cx="560" cy="210" r="96" fill="none" stroke="#fff" stroke-width="4"/>
  <g fill="none" stroke="#e3806a" stroke-width="3" stroke-linecap="round">
    <path d="M454 134v-20h20M646 134v-20h-20M454 286v20h20M646 286v20h-20"/>
  </g>

  <rect x="470" y="330" width="250" height="104" rx="14" fill="#fff" stroke="#f1e1da"/>
  <text x="488" y="354" fill="#a07a6e" font-size="10" font-weight="700" letter-spacing="1.5">AI SKIN ANALYSIS</text>
  <g font-size="11" fill="#4a2a22">
    <text x="488" y="378">Hydration</text><text x="488" y="398">Clarity</text><text x="488" y="418">Texture</text>
  </g>
  <g fill="#f6e6df"><rect x="560" y="370" width="140" height="8" rx="4"/><rect x="560" y="390" width="140" height="8" rx="4"/><rect x="560" y="410" width="140" height="8" rx="4"/></g>
  <rect class="bar" x="560" y="370" width="112" height="8" rx="4" fill="#e3806a"/>
  <rect class="bar" x="560" y="390" width="88" height="8" rx="4" fill="#c99280"/>
  <rect class="bar" x="560" y="410" width="124" height="8" rx="4" fill="#9f86d4"/>
</svg>
